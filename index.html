<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지권 문제 투자 (모둠전) - 실시간 멀티 디바이스 웹앱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK (ES5/ES6 호환 LTS 버전 8.10.1) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .font-title {
            font-family: 'Gowun Dodum', sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }
        .badge-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 md:p-5 flex flex-col justify-between min-h-screen">

    <header class="glass-panel rounded-2xl p-3.5 mb-3 flex flex-wrap justify-between items-center shadow-lg border-b border-indigo-500/20">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600/30 p-2.5 rounded-xl border border-indigo-400/30 text-indigo-400 text-xl">
                <i class="fa-solid fa-mountain fa-bounce" style="--fa-animation-duration: 4s;"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-300 to-emerald-300 font-title">
                    지권 문제 투자 <span id="gameModeBadgeHeader" class="text-xs px-2 py-0.5 rounded-full bg-amber-500/30 text-amber-300 border border-amber-400/30 font-sans">모둠전 (1~5모둠)</span>
                </h1>
                <p class="text-xs text-slate-400">중2 과학 [지구계, 지권의 층상 구조, 암석과 광물] 모둠별 게이미피케이션 수업 도구</p>
            </div>
        </div>

        <div class="flex items-center gap-2 mt-2 sm:mt-0">
            <div id="roomPinBadge" class="hidden px-3 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-mono font-bold text-sm">
                📌 PIN: <span id="pinDisplay" class="text-base font-black">---</span>
            </div>
            <button id="soundToggleBtn" onclick="toggleSound()" class="px-3 py-1.5 rounded-xl glass-panel text-slate-300 hover:text-white hover:bg-slate-700/50 transition text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-volume-high text-indigo-400" id="soundIcon"></i>
                <span id="soundText" class="hidden sm:inline">효과음 ON</span>
            </button>
            <button onclick="exitToHome()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i>
                <span class="hidden sm:inline">메인으로</span>
            </button>
        </div>
    </header>

    <main id="appContainer" class="flex-grow flex flex-col justify-center">
        <!-- JavaScript로 동적 화면 전환 -->
    </main>

    <footer class="mt-4 text-center text-xs text-slate-500 py-1.5 border-t border-slate-800/60">
        수업디자인 연수 오전 강의용 | 중학교 2학년 과학 [지권 문제 투자 시스템 - 모둠전]
    </footer>

    <!-- 대출 심사 퀴즈 모달 (다회차 가변 이율 적용) -->
    <div id="rescueQuizModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/90 border-2 border-emerald-500/50 rounded-3xl p-6 md:p-8 max-w-lg w-full glow-effect relative space-y-4">
            <div class="flex items-center gap-3 text-emerald-400">
                <i class="fa-solid fa-building-columns text-3xl animate-pulse"></i>
                <div>
                    <h3 class="text-xl font-bold font-title text-emerald-300" id="rescueQuizTitle">대출 심사 개념 퀴즈</h3>
                    <span class="text-xs text-emerald-400/90 font-semibold" id="loanRateSubtitle">희망 대출 액수를 선택하고 퀴즈를 맞추세요!</span>
                </div>
            </div>
            <hr class="border-slate-700/60">
            
            <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="text-xs text-amber-400 font-bold"><i class="fa-solid fa-circle-question"></i> 개념 확인 문제</div>
                <p class="text-sm font-semibold text-slate-100" id="rescueQuizStatement">
                    지표면 근처에서 마그마가 빨리 식어서 만들어진 화산암은 결정의 크기가 작다. (O/X)
                </p>
            </div>

            <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 space-y-2">
                <div class="flex justify-between items-center text-xs text-slate-300">
                    <span class="font-bold text-slate-300"><i class="fa-solid fa-hand-holding-dollar text-amber-400 mr-1"></i>희망 대출 신청 금액:</span>
                    <span id="requestedLoanDisplay" class="text-amber-300 font-black text-base">50 pt</span>
                </div>
                <input type="range" id="requestedLoanRange" min="10" max="500" step="10" value="50" data-rate="1.1" oninput="updateLoanEstimate(this.value)" class="w-full accent-amber-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                <p class="text-[11px] text-amber-300/90 font-medium">
                    ⚠️ 상환 이율: <span id="currentLoanRateBadge" class="font-bold text-amber-400">110%</span> (상환 시 <span id="repaymentEstimateDisplay" class="font-bold text-amber-300">55</span> pt가 부채로 청구됩니다)
                </p>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
                <button onclick="submitRescueAnswer(true)" class="py-3.5 rounded-2xl font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 text-base transition">
                    ⭕ O (그렇다)
                </button>
                <button onclick="submitRescueAnswer(false)" class="py-3.5 rounded-2xl font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-rose-400 text-base transition">
                    ❌ X (아니다)
                </button>
            </div>
        </div>
    </div>

    <script>
        window.gameState = {
            role: null,
            roomId: null,
            myTeamId: null,
            roomData: null,
            soundEnabled: true,
            setupCount: 5
        };

        window.clientLocalInput = {
            choice: null,
            bid: 10
        };

        window.db = null;
        window.auth = null;
        window.roomUnsubscribe = null;
        window.hostPingInterval = null;
        window.appId = 'earth-strata-investment-team';

        var resolveAuthPromise;
        window.authReady = new Promise(function(resolve) {
            resolveAuthPromise = resolve;
        });

        window.getRoomDocRef = function(pin) {
            if (!window.db) return null;
            return window.db.collection('artifacts').doc(window.appId).collection('public').doc('data').collection('rooms').doc(pin);
        };

        window.questionBank = [
            { id: 1, category: "지구계 구성 요소", statement: "암석과 토양으로 이루어진 지표와 지구 내부를 통틀어 '지권'이라고 부른다.", isTrue: true, explanation: "참(True)! 지권은 지구계의 구성 요소 중 암석과 토양으로 이루어진 지표와 내부를 뜻합니다." },
            { id: 2, category: "지구계 구성 요소", statement: "태양이나 달 같은 우주 천체들은 지구계의 '기권'에 속한다.", isTrue: false, explanation: "거짓(False)! 태양이나 달 같은 천체들은 기권 바깥의 우주인 '외권'에 속합니다." },
            { id: 3, category: "지구 내부 구조", statement: "과학자들은 구멍을 직접 뚫는 시추법을 통해 지구 내부 전체의 층상 구조를 완벽하게 밝혀내었다.", isTrue: false, explanation: "거짓(False)! 시추는 깊이의 한계가 있으며, 지구 내부 전체 구조는 '지진파' 분석을 통해 알아냈습니다." },
            { id: 4, category: "지권의 층상 구조", statement: "지권의 층상 구조 중 지구 전체 부피의 약 80%를 차지하는 가장 두꺼운 층은 '맨틀'이다.", isTrue: true, explanation: "참(True)! 맨틀은 지각 아래부터 깊이 약 2900km까지이며 지구 전체 부피의 약 80%를 차지하는 유동성 고체 층입니다." },
            { id: 5, category: "지권의 층상 구조", statement: "지구의 외핵은 액체 상태로 추정되며, 철과 니켈 같은 물질로 이루어져 있다.", isTrue: true, explanation: "참(True)! 외핵은 액체 상태로 추정되며 철과 니켈 등의 무거운 물질로 이루어져 있습니다." },
            { id: 6, category: "암석과 광물", statement: "암석을 이루는 주된 알갱이들을 '조암 광물'이라고 부르며, 화강암 속에는 석영, 장석, 흑운모 등이 포함되어 있다.", isTrue: true, explanation: "참(True)! 암석은 여러 광물 알갱이로 이루어져 있으며 대표적인 조암 광물로 석영, 장석, 흑운모 등이 있습니다." },
            { id: 7, category: "화성암의 생성", statement: "마그마가 식어서 굳어진 암석을 '화성암'이라고 부른다.", isTrue: true, explanation: "참(True)! 마그마가 지하 깊은 곳이나 지표면 근처에서 식어서 굳어진 암석을 화성암이라고 합니다." },
            { id: 8, category: "화성암의 분류", statement: "지표면 근처에서 마그마가 빨리 식어서 만들어진 화산암은 광물 결정(알갱이)의 크기가 매우 크고 뚜렷하다.", isTrue: false, explanation: "거짓(False)! 빨리 식으면 결정이 자랄 시간이 부족해 알갱이 크기가 작습니다. 결정이 큰 것은 천천히 식은 심성암입니다." },
            { id: 9, category: "화성암의 종류", statement: "지하 깊은 곳에서 마그마가 천천히 식어서 만들어진 대표적인 심성암에는 '화강암'이 있다.", isTrue: true, explanation: "참(True)! 화강암은 지하 깊은 곳에서 천천히 식어 광물 알갱이가 크고 뚜렷하게 발달한 심성암입니다." },
            { id: 10, category: "광물의 특성", statement: "광물을 조흔판에 긁었을 때 나타나는 광물 가루의 색을 '조흔색'이라고 한다.", isTrue: true, explanation: "참(True)! 조흔색은 광물의 겉보기 색이 비슷할 때 진짜 가루 색을 확인하여 구별하는 유용한 특성입니다." },
            { id: 11, category: "광물의 특성", statement: "자철석과 적철석은 겉보기 색이 모두 검은색이지만, 조흔색(가루 색)을 비교하면 서로 다르게 나타난다.", isTrue: true, explanation: "참(True)! 자철석은 검은색 가루, 적철석은 적갈색 가루가 나와 조흔색으로 구별이 가능합니다." },
            { id: 12, category: "광물의 특성", statement: "석영은 방해석보다 무르기 때문에 서로 긁었을 때 석영에 흠집이 생긴다.", isTrue: false, explanation: "거짓(False)! 석영이 방해석보다 더 단단하기 때문에 두 광물을 긁으면 방해석에 흠집이 생깁니다." },
            { id: 13, category: "광물의 특성", statement: "방해석에 묽은 염산을 떨어뜨리면 반응하여 거품(이산화 탄소 기체)이 발생한다.", isTrue: true, explanation: "참(True)! 방해석은 염산과 반응해 거품을 내는 뚜렷한 성질이 있어 다른 광물과 쉽게 구별됩니다." },
            { id: 14, category: "광물의 특성", statement: "자철석은 철 성분을 포함하고 있어 클립이나 쇠못을 끌어당기는 '자성'을 띤다.", isTrue: true, explanation: "참(True)! 자철석은 이름 그대로 자성을 띠어 쇠붙이(클립 등)를 끌어당깁니다." },
            { id: 15, category: "화성암의 분류", statement: "화성암은 주로 '암석의 색깔'과 '광물 결정(알갱이)의 크기' 두 가지 기준을 통해 분류한다.", isTrue: true, explanation: "참(True)! 지질학자들은 암석의 색깔과 결정의 크기를 기준으로 화성암을 체계적으로 분류합니다." }
        ];

        window.showToast = function(msg) {
            var toast = document.getElementById('toastMessage');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toastMessage';
                toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-amber-600 text-white font-bold px-5 py-3 rounded-2xl shadow-2xl border border-amber-400 text-sm transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2';
                document.body.appendChild(toast);
            }
            toast.innerHTML = '<i class="fa-solid fa-circle-info"></i> <span>' + msg + '</span>';
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(function() {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3200);
        };

        window.initApp = async function() {
            try {
                if (typeof firebase !== 'undefined') {
                    var firebaseConfig = {
                        apiKey: "AIzaSyCqnfjj_gyBZ3EEVOXJurhvsihlFj_emtE",
                        authDomain: "investment-9eab1.firebaseapp.com",
                        projectId: "investment-9eab1",
                        storageBucket: "investment-9eab1.firebasestorage.app",
                        messagingSenderId: "976762188659",
                        appId: "1:976762188659:web:1bac8684b9c38c573ccb06",
                        measurementId: "G-QEZ41GM2Y6"
                    };

                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    window.auth = firebase.auth();
                    window.db = firebase.firestore();

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await window.auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await window.auth.signInAnonymously();
                    }
                }
            } catch (err) {
                console.warn("Firebase 초기화 중 경고:", err);
            } finally {
                if (resolveAuthPromise) resolveAuthPromise();
            }

            var savedPin = localStorage.getItem('earth_strata_team_host_pin');
            if (savedPin && window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(savedPin).get();
                    if (docSnap.exists) {
                        await window.reconnectHostRoom(savedPin);
                        return;
                    }
                } catch (e) {
                    console.warn("Auto reconnect failed:", e);
                }
            }

            window.renderRoleSelection();
        };

        window.playSound = function(type) {
            if (!window.gameState.soundEnabled) return;
            try {
                var AudioCtx = window.AudioContext || window.webkitAudioContext;
                var audioCtx = new AudioCtx();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                var now = audioCtx.currentTime;
                if (type === 'click') {
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(160, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {}
        };

        window.toggleSound = function() {
            window.gameState.soundEnabled = !window.gameState.soundEnabled;
            document.getElementById('soundText').innerText = window.gameState.soundEnabled ? '효과음 ON' : '효과음 OFF';
            document.getElementById('soundIcon').className = window.gameState.soundEnabled ? 'fa-solid fa-volume-high text-amber-400' : 'fa-solid fa-volume-xmark text-slate-500';
        };

        window.exitToHome = function() {
            if (window.hostPingInterval) clearInterval(window.hostPingInterval);
            
            if (window.gameState.role === 'host' && window.db && window.gameState.roomId) {
                window.getRoomDocRef(window.gameState.roomId).update({ hostActive: false });
            }

            if (window.roomUnsubscribe) {
                window.roomUnsubscribe();
                window.roomUnsubscribe = null;
            }

            window.gameState.role = null;
            window.gameState.roomId = null;
            document.getElementById('roomPinBadge').classList.add('hidden');
            window.renderRoleSelection();
            window.showToast("메인 화면으로 돌아왔습니다.");
        };

        window.renderRoleSelection = function() {
            var savedPin = localStorage.getItem('earth_strata_team_host_pin');
            var container = document.getElementById('appContainer');

            container.innerHTML = `
                <div class="max-w-4xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
                    <div class="glass-panel rounded-3xl p-6 md:p-8 glow-effect flex flex-col justify-between space-y-6 border border-amber-500/30 hover:border-amber-400 transition">
                        <div class="space-y-4">
                            <div class="w-14 h-14 rounded-2xl bg-amber-600/30 border border-amber-400/40 text-amber-300 flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-chalkboard-user"></i>
                            </div>
                            <div>
                                <h2 class="text-2xl font-black font-title text-amber-100">🖥️ 교사 화면 (전면 스크린)</h2>
                                <p class="text-xs text-slate-300 mt-1">전자칠판에 방 PIN을 띄우고, 1~5모둠의 실시간 문제 투자를 제어합니다.</p>
                            </div>

                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/60 space-y-2">
                                <div class="text-xs font-bold text-amber-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-users-rectangle"></i> 모둠전 전용 모드
                                </div>

                                    <label class="block text-xs font-bold text-slate-400 mb-1">내 모둠 선택</label>

        window.startHostHeartbeat = function(pin) {
            if (window.hostPingInterval) clearInterval(window.hostPingInterval);

            window.hostPingInterval = setInterval(function() {
                if (window.gameState.role === 'host' && window.db) {
                    window.getRoomDocRef(pin).update({
                        hostActive: true,
                        lastHostPing: Date.now()
                    }).catch(function(err) {
                        console.warn("Heartbeat update error:", err);
                    });
                }
            }, 3000);

            window.addEventListener('beforeunload', function() {
                if (window.gameState.role === 'host' && window.db && window.gameState.roomId) {
                    window.getRoomDocRef(window.gameState.roomId).update({ hostActive: false });
                }
            });
        };

        window.checkPinAndLoadTeams = async function(retryCount) {
            if (typeof retryCount === 'undefined') retryCount = 0;
            await window.authReady;

            var pinInput = document.getElementById('joinPinInput');
            var statusDiv = document.getElementById('pinCheckStatus');
            var select = document.getElementById('joinTeamSelect');
            if (!pinInput || !statusDiv || !select) return;

            var rawPin = pinInput.value.replace(/[^0-9]/g, '');
            pinInput.value = rawPin;
            var pin = rawPin.trim();

            if (pin.length < 4) {
                statusDiv.className = "text-[11px] mt-1 text-slate-400 text-center font-bold";
                statusDiv.innerText = "PIN 번호 4자리를 입력해주세요";
                select.innerHTML = '<option value="">PIN 번호를 먼저 입력하세요</option>';
                return;
            }

            statusDiv.className = "text-[11px] mt-1 text-indigo-300 text-center font-bold";
            statusDiv.innerText = retryCount > 0 ? "🔍 방 정보를 검색 중입니다 (" + retryCount + "/3)..." : "🔍 방 정보 확인 중...";

            if (window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(pin).get();
                    if (docSnap.exists) {
                        var room = docSnap.data();
                        statusDiv.className = "text-[11px] mt-1 text-emerald-400 text-center font-bold";
                        statusDiv.innerText = "✅ 방 확인 완료 (1~5모둠전)";
                        window.updateJoinSelectOptions(room);
                    } else if (retryCount < 2) {
                        setTimeout(function() { window.checkPinAndLoadTeams(retryCount + 1); }, 800);
                    } else {
                        statusDiv.className = "text-[11px] mt-1 text-rose-400 text-center font-bold";
                        statusDiv.innerText = "❌ 존재하지 않는 PIN 번호입니다.";
                        select.innerHTML = '<option value="">올바른 PIN을 입력하세요</option>';
                    }
                } catch (err) {
                    console.error("Firestore get error:", err);
                    statusDiv.className = "text-[11px] mt-1 text-rose-400 text-center font-bold";
                    statusDiv.innerText = "❌ 서버 접속 실패 (Firebase 규칙 확인)";
                }
            } else if (window.gameState.roomData && window.gameState.roomData.roomId === pin) {
                var room = window.gameState.roomData;
                statusDiv.className = "text-[11px] mt-1 text-emerald-400 text-center font-bold";
                statusDiv.innerText = "✅ 방 확인 완료 (미리보기 모드)";
                window.updateJoinSelectOptions(room);
            } else {
                statusDiv.className = "text-[11px] mt-1 text-rose-400 text-center font-bold";
                statusDiv.innerText = "❌ 존재하지 않는 PIN 번호입니다.";
                select.innerHTML = '<option value="">올바른 PIN을 입력하세요</option>';
            }
        };

        window.updateJoinSelectOptions = function(data) {
            var select = document.getElementById('joinTeamSelect');
            if (!select || !data || !data.teams) return;

            var teamsList = Object.values(data.teams);
            var html = '';
            teamsList.forEach(function(t) {
                var statusText = t.joined ? ' (🟢 접속됨)' : ' (⚪ 미접속)';
                html += `<option value="${t.id}">${t.name}${statusText}</option>`;
            });
            select.innerHTML = html;
        };

        window.reconnectHostByInputPin = function() {
            var input = document.getElementById('hostReconnectPinInput');
            if (!input) return;
            var pin = input.value.replace(/[^0-9]/g, '').trim();

            if (!pin || pin.length !== 4) {
                window.showToast("4자리 방 PIN 번호를 정확히 입력하세요!");
                return;
            }
            window.reconnectHostRoom(pin);
        };

        window.reconnectHostRoom = async function(pin) {
            playSound('click');
            await window.authReady;

            if (window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(pin).get();
                    if (docSnap.exists) {
                        window.gameState.role = 'host';
                        window.gameState.roomId = pin;
                        window.gameState.roomData = docSnap.data();

                        localStorage.setItem('earth_strata_team_host_pin', pin);

                        document.getElementById('pinDisplay').innerText = pin;
                        document.getElementById('roomPinBadge').classList.remove('hidden');

                        await window.getRoomDocRef(pin).update({
                            hostActive: true,
                            lastHostPing: Date.now()
                        });

                        if (window.roomUnsubscribe) window.roomUnsubscribe();
                        window.roomUnsubscribe = window.getRoomDocRef(pin).onSnapshot(function(snap) {
                            if (snap.exists) {
                                window.gameState.roomData = snap.data();
                                window.renderHostScreen();
                            }
                        });

                        window.startHostHeartbeat(pin);
                        window.renderHostScreen();
                        window.showToast("🎉 PIN " + pin + "번 모둠방에 교사 권한으로 복귀했습니다!");
                        return;
                    }
                } catch (err) {
                    console.error("Reconnect error:", err);
                }
            }
            window.showToast("입력한 PIN 번호의 방을 찾을 수 없습니다.");
        };

        window.setupHostRoom = async function() {
            playSound('click');
            await window.authReady;

            var pin = Math.floor(1000 + Math.random() * 9000).toString();
            window.gameState.role = 'host';
            window.gameState.roomId = pin;

            localStorage.setItem('earth_strata_team_host_pin', pin);

            document.getElementById('pinDisplay').innerText = pin;
            document.getElementById('roomPinBadge').classList.remove('hidden');

            var initialParticipants = {};
            for (var i = 1; i <= 5; i++) {
                var key = i.toString();
                var name = `${i}모둠`;
                initialParticipants[key] = {
                    id: key,
                    name: name,
                    points: 100,
                    currentBid: 5,
                    choice: null,
                    submitted: false,
                    joined: false,
                    rescueRequested: false,
                    requestedLoanAmount: 50,
                    debt: 0,
                    loanCount: 0
                };
            }

            var roomData = {
                roomId: pin,
                mode: 'team',
                maxPlayers: 5,
                status: 'waiting',
                currentQuestionIdx: 0,
                isRevealed: false,
                teams: initialParticipants,
                hostActive: true,
                lastHostPing: Date.now(),
                updatedAt: Date.now()
            };

            window.gameState.roomData = roomData;

            if (window.db) {
                try {
                    await window.getRoomDocRef(pin).set(roomData);
                    if (window.roomUnsubscribe) window.roomUnsubscribe();
                    window.roomUnsubscribe = window.getRoomDocRef(pin).onSnapshot(function(docSnap) {
                        if (docSnap.exists) {
                            window.gameState.roomData = docSnap.data();
                            window.renderHostScreen();
                        }
                    });
                    window.startHostHeartbeat(pin);
                } catch (e) {
                    console.error("Host room creation error:", e);
                    window.showToast("방 생성 중 오류가 발생했습니다.");
                }
            }
            window.renderHostScreen();
        };

        window.renderHostScreen = function() {
            var data = window.gameState.roomData;
            if (!data) return;
            if (data.status === 'waiting') {
                window.renderHostLobby();
            } else if (data.status === 'playing') {
                window.renderHostDashboard();
            } else if (data.status === 'debriefing') {
                window.renderDebriefingViewHost();
            }
        };

            var data = window.gameState.roomData;
            var teamsList = Object.values(data.teams);
            var totalCount = teamsList.length;

                <div class="max-w-4xl mx-auto w-full space-y-4 my-auto py-2">
                    <div class="glass-panel rounded-3xl p-6 md:p-8 text-center glow-effect border-2 border-amber-500/40 relative overflow-hidden">
                        <div class="text-xs sm:text-sm font-bold text-amber-300 tracking-wider uppercase mb-1">
                            <i class="fa-solid fa-wifi mr-1.5 animate-pulse text-emerald-400"></i>모둠 기기 접속용 방 PIN 번호
                        </div>
                        <div class="text-6xl sm:text-8xl font-black font-mono tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-300 to-emerald-300 my-2 drop-shadow-lg">
                            ${data.roomId}

                        <p class="text-xs sm:text-sm text-slate-300">
                            각 모둠은 오른쪽 <span class="text-emerald-300 font-bold">'모둠 기기 접속'</span>에서 PIN 번호 <span class="font-bold text-amber-300 font-mono text-base">${data.roomId}</span>와(과) 모둠 번호를 선택하여 입장하세요.

                                <i class="fa-solid fa-wand-magic-sparkles"></i>

                    <div class="glass-panel rounded-3xl p-5 border border-slate-800 space-y-3">

                            </h3>
                            <div class="flex items-center gap-3 text-xs">
                                <span class="flex items-center gap-1 text-emerald-400 font-bold"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block animate-ping"></span> 접속 완료 (${joinedCount})</span>
                                <span class="flex items-center gap-1 text-slate-500"><span class="w-2.5 h-2.5 rounded-full bg-slate-700 inline-block"></span> 미접속 (${totalCount - joinedCount})</span>
                            </div>

                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 p-1">
                            ${teamsList.map(function(t) {

                                        </div>

                                        <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold ${t.joined ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800/80 text-slate-500'}">
                                            ${t.joined ? '접속 완료' : '대기 중'}

                    </div>

                    <button onclick="startHostGame()" class="w-full py-4 bg-gradient-to-r from-amber-500 via-orange-500 to-emerald-600 hover:from-amber-400 hover:to-emerald-500 text-slate-950 font-black rounded-2xl shadow-xl transition font-title text-lg flex items-center justify-center gap-3">
                        <i class="fa-solid fa-play text-xl animate-bounce"></i>
                        <span>지권 문제 투자 시작하기 (문항 1 진행)</span>
                    </button>
                </div>
            `;
        };

        window.simulateMockJoins = function() {
            playSound('click');
            var data = window.gameState.roomData;
            Object.values(data.teams).forEach(function(t) {
                t.joined = true;
            });

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams });
            } else {
                window.renderHostScreen();
            }
        };

            playSound('correct');
            var data = window.gameState.roomData;
            data.status = 'playing';

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({
                    status: 'playing',
                    updatedAt: Date.now()
                });
            } else {
                window.renderHostScreen();
            }
        };

                        <div class="bg-slate-950/80 p-4 md:p-6 rounded-2xl border border-slate-800 text-center my-1">

        window.adjustTeamPoints = function(teamId, amount) {
            var data = window.gameState.roomData;
            if (data && data.teams && data.teams[teamId]) {
                var team = data.teams[teamId];
                team.points = Math.max(0, team.points + amount);

                if (window.db) {
                    window.getRoomDocRef(data.roomId).update({ teams: data.teams });
                } else {
                    window.renderHostScreen();
                }
                window.showToast("⚙️ " + team.name + "의 자본금이 " + (amount > 0 ? '+' + amount : amount) + " pt 조정되었습니다.");
            }
        };

        window.approveRescueByHost = function(targetTeamId) {
            playSound('correct');
            var data = window.gameState.roomData;
            
            if (data.teams && data.teams[targetTeamId]) {
                var team = data.teams[targetTeamId];
                var inputElem = document.getElementById('hostLoanAmt_' + targetTeamId);
                var rawVal = inputElem ? parseInt(inputElem.value) : (team.requestedLoanAmount || 50);
                var approvedAmount = Math.max(10, Math.round(rawVal / 10) * 10);
                
                var loanAttempt = (team.loanCount || 0) + 1;
                var rate = 1.0 + (loanAttempt * 0.1);
                var debtForThisLoan = Math.round(approvedAmount * rate);

                team.points += approvedAmount;
                team.debt = (team.debt || 0) + debtForThisLoan;
                team.loanCount = loanAttempt;
                team.rescueRequested = false;

                if (window.db) {
                    window.getRoomDocRef(data.roomId).update({ teams: data.teams });
                } else {
                    window.renderHostScreen();
                }
                window.showToast("🎉 " + team.name + "에게 " + loanAttempt + "회차 대출금 +" + approvedAmount + " pt가 지급되었습니다! (대출 상환금: " + debtForThisLoan + " pt / 총 부채: " + team.debt + " pt)");
            }
        };

        window.simulateMockSubmissions = function() {
            playSound('click');
            var data = window.gameState.roomData;
            Object.values(data.teams).forEach(function(t) {
                if (t.points > 0) {
                    t.choice = Math.random() > 0.35 ? (window.questionBank[data.currentQuestionIdx].isTrue ? 'True' : 'False') : (window.questionBank[data.currentQuestionIdx].isTrue ? 'False' : 'True');
                    t.currentBid = Math.min(t.points, Math.floor(Math.random() * 4 + 1) * 5);
                    t.submitted = true;
                }
            });

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams });
            } else {
                window.renderHostScreen();
            }
        };

        window.revealHostResult = function() {
            playSound('correct');
            var data = window.gameState.roomData;
            var q = window.questionBank[data.currentQuestionIdx];

            data.isRevealed = true;

            Object.values(data.teams).forEach(function(t) {
                if (t.submitted && t.choice) {
                    var isCorrect = (t.choice === 'True' && q.isTrue) || (t.choice === 'False' && !q.isTrue);
                    if (isCorrect) {
                        t.points += t.currentBid;
                    } else {
                        t.points = Math.max(0, t.points - t.currentBid);
                    }
                }
            });

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({
                    isRevealed: true,
                    teams: data.teams,
                    updatedAt: Date.now()
                });
            } else {
                window.renderHostScreen();
            }
        };

        window.nextHostQuestion = function() {
            playSound('click');
            var data = window.gameState.roomData;
            if (data.currentQuestionIdx < window.questionBank.length - 1) {
                data.currentQuestionIdx++;
                data.isRevealed = false;

                window.clientLocalInput = { choice: null, bid: 5 };

                Object.values(data.teams).forEach(function(t) {
                    t.choice = null;
                    t.currentBid = Math.min(5, t.points);
                    t.submitted = false;
                });

                if (window.db) {
                    window.getRoomDocRef(data.roomId).update({
                        currentQuestionIdx: data.currentQuestionIdx,
                        isRevealed: false,
                        teams: data.teams,
                        updatedAt: Date.now()
                    });
                } else {
                    window.renderHostScreen();
                }
            }
        };

        window.joinClientRoom = async function() {
            playSound('click');
            await window.authReady;

            var pinInput = document.getElementById('joinPinInput');
            var teamId = document.getElementById('joinTeamSelect') ? document.getElementById('joinTeamSelect').value : '';
            var pin = pinInput ? pinInput.value.replace(/[^0-9]/g, '').trim() : '';

            if (!pin || pin.length !== 4) {
                window.showToast("올바른 4자리 방 PIN 번호를 입력하세요!");
                return;
            }

            if (!teamId) {
                window.showToast("참여할 모둠을 선택해 주세요!");
                return;
            }

            window.gameState.role = 'client';
            window.gameState.roomId = pin;
            window.gameState.myTeamId = teamId;

            document.getElementById('pinDisplay').innerText = pin;
            document.getElementById('roomPinBadge').classList.remove('hidden');

            if (window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(pin).get();
                    if (!docSnap.exists) {
                        window.showToast("존재하지 않는 방 번호입니다. 교사 화면의 PIN 번호를 확인하세요.");
                        return;
                    }

                    var room = docSnap.data();
                    if (!room.teams) room.teams = {};
                    
                    if (room.teams[teamId]) {
                        room.teams[teamId].joined = true;
                    }

                    await window.getRoomDocRef(pin).update({ teams: room.teams });

                    if (window.roomUnsubscribe) window.roomUnsubscribe();
                    window.roomUnsubscribe = window.getRoomDocRef(pin).onSnapshot(function(snap) {
                        if (snap.exists) {
                            window.gameState.roomData = snap.data();
                            window.renderClientDashboard();
                        }
                    }, function(error) {
                        console.error("Snapshot error:", error);
                        window.showToast("실시간 연결에 문제가 발생했습니다.");
                    });
                } catch (err) {
                    console.error("Join error:", err);
                    window.showToast("방 입장 중 오류가 발생했습니다. 다시 시도해 주세요.");
                }
            } else {
                if (!window.gameState.roomData) {
                    var initialParticipants = {};
                    for (var i = 1; i <= 5; i++) {
                        var key = i.toString();
                        initialParticipants[key] = {
                            id: key, name: `${i}모둠`, points: 100, currentBid: 5, choice: null, submitted: false, joined: false, rescueRequested: false, debt: 0, loanCount: 0
                        };
                    }
                    window.gameState.roomData = {
                        roomId: pin,
                        mode: 'team',
                        maxPlayers: 5,
                        status: 'waiting',
                        currentQuestionIdx: 0,
                        isRevealed: false,
                        teams: initialParticipants,
                        hostActive: true,
                        updatedAt: Date.now()
                    };
                }
                if (window.gameState.roomData.teams && window.gameState.roomData.teams[teamId]) {
                    window.gameState.roomData.teams[teamId].joined = true;
                }
                window.renderClientDashboard();
            }
        };

                                        <p class="text-xs text-slate-300 mt-1">대출 심사 퀴즈를 맞추면 <strong>${nextLoanCount}회차 대출 (상환율 ${nextLoanRate}%)</strong>을 신청할 수 있습니다.</p>
                                    </div>
                                    <button onclick="openRescueQuizModal()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-2xl shadow-xl transition font-title text-base flex items-center justify-center gap-2 badge-glow">
                                        <i class="fa-solid fa-file-pen text-lg"></i>
                                        <span>${nextLoanCount}회차 대출 퀴즈 도전 (이율 ${nextLoanRate}%)</span>
                                    </button>
                                </div>
                            `}
                        ` : `
                            <div id="clientBiddingForm" class="glass-panel rounded-2xl p-5 space-y-4 border border-amber-500/30">
                                <div class="flex justify-between items-center">
                                    <h3 class="font-bold text-sm text-slate-300 font-title"><i class="fa-solid fa-gavel text-amber-400 mr-2"></i>참/거짓 및 투자 금액 선택 (5포인트 단위)</h3>
                                </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="clientSelectChoice('True')" id="btnChoiceTrue" ${myTeam.submitted ? 'disabled' : ''} class="py-3 rounded-2xl font-bold border text-sm transition ${currentChoice === 'True' ? 'bg-amber-600 border-amber-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">
                                        ⭕ 참 (True)
                                    </button>
                                    <button onclick="clientSelectChoice('False')" id="btnChoiceFalse" ${myTeam.submitted ? 'disabled' : ''} class="py-3 rounded-2xl font-bold border text-sm transition ${currentChoice === 'False' ? 'bg-rose-600 border-rose-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">
                                        ❌ 거짓 (False)
                                    </button>
                                </div>

                                <div class="space-y-2 pt-1">
                                    <div class="flex justify-between text-xs text-slate-400">
                                        <span>문제 투자 금액 (보유 자본: ${maxPt}pt / 5pt 단위)</span>
                                        <span id="bidValueDisplay" class="text-amber-300 font-black text-sm">${currentBid} pt</span>
                                    </div>
                                    <input type="range" id="bidRangeInput" min="${minPt}" max="${maxPt}" step="5" value="${currentBid}" oninput="clientUpdateBid(this.value)" ${myTeam.submitted ? 'disabled' : ''} class="w-full accent-amber-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                                </div>

                                <button onclick="clientSubmitBid()" id="btnSubmitBid" ${!currentChoice ? 'disabled' : ''} class="w-full py-3.5 rounded-xl font-black transition font-title text-base flex items-center justify-center gap-2 ${myTeam.submitted ? 'bg-emerald-700 text-emerald-100 cursor-default' : (currentChoice ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed')}">
                                    <i class="fa-solid fa-paper-plane"></i>
                                    <span>${myTeam.submitted ? '투자 제출 완료 (수정 가능)' : '투자 확정하기'}</span>
                                </button>
                            </div>
                        `}
                    ` : `
                        <div class="glass-panel rounded-2xl p-6 text-center space-y-3 border-2 ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? 'border-emerald-500 bg-emerald-950/20' : 'border-rose-500 bg-rose-950/20'}">
                            <div class="text-3xl">
                                ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? '🎉' : '💥'}
                            </div>
                            <h3 class="text-xl font-black font-title ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? 'text-emerald-300' : 'text-rose-300'}">
                                ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? '투자 성공! 수익 획득' : '투자 실패! 자본금 차감'}
                            </h3>
                            <p class="text-xs text-slate-300">
                                선생님의 다음 문제 정산 진행을 기다려주세요.
                            </p>
                        </div>
                    `}
                </div>
            `;
        };

        window.openRescueQuizModal = function() {
            playSound('click');
            var data = window.gameState.roomData;
            var myTeamId = window.gameState.myTeamId;
            var myTeam = data ? data.teams[myTeamId] : null;

            var loanCount = myTeam ? (myTeam.loanCount || 0) : 0;
            var nextAttempt = loanCount + 1;
            var ratePercent = 100 + (nextAttempt * 10);
            var rateMultiplier = 1.0 + (nextAttempt * 0.1);

            var titleElem = document.getElementById('rescueQuizTitle');
            var rateBadge = document.getElementById('currentLoanRateBadge');
            var rangeElem = document.getElementById('requestedLoanRange');

            if (titleElem) titleElem.innerText = "대출 심사 개념 퀴즈 (" + nextAttempt + "회차 대출)";
            if (rateBadge) rateBadge.innerText = ratePercent + "%";
            if (rangeElem) {
                rangeElem.dataset.rate = rateMultiplier.toFixed(2);
                window.updateLoanEstimate(rangeElem.value);
            }

            document.getElementById('rescueQuizModal').classList.remove('hidden');
        };

        window.updateLoanEstimate = function(val) {
            var rangeElem = document.getElementById('requestedLoanRange');
            var rate = rangeElem && rangeElem.dataset.rate ? parseFloat(rangeElem.dataset.rate) : 1.1;

            var display = document.getElementById('requestedLoanDisplay');
            var estDisplay = document.getElementById('repaymentEstimateDisplay');
            if (display) display.innerText = val + ' pt';
            if (estDisplay) estDisplay.innerText = Math.round(parseInt(val) * rate);
        };

        window.clientRepayLoan = function() {
            var data = window.gameState.roomData;
            var myTeamId = window.gameState.myTeamId;
            var myTeam = data ? data.teams[myTeamId] : null;

            if (!myTeam || !myTeam.debt || myTeam.debt <= 0) return;

            if (myTeam.points < myTeam.debt) {
                window.showToast("❌ 자본금이 부족하여 대출을 상환할 수 없습니다. (필요: " + myTeam.debt + " pt / 보유: " + myTeam.points + " pt)");
                return;
            }

            playSound('correct');
            myTeam.points -= myTeam.debt;
            var repaidAmt = myTeam.debt;
            myTeam.debt = 0;

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams });
            } else {
                window.renderClientDashboard();
            }
            window.showToast("🎉 대출금 " + repaidAmt + " pt를 성공적으로 전액 상환했습니다!");
        };

        window.submitRescueAnswer = function(answer) {
            var isCorrect = (answer === true);

            if (isCorrect) {
                playSound('correct');
                document.getElementById('rescueQuizModal').classList.add('hidden');
                
                var data = window.gameState.roomData;
                var myTeamId = window.gameState.myTeamId;
                var loanRange = document.getElementById('requestedLoanRange');
                var reqAmount = loanRange ? parseInt(loanRange.value) : 50;

                data.teams[myTeamId].rescueRequested = true;
                data.teams[myTeamId].requestedLoanAmount = reqAmount;

                if (window.db) {
                    window.getRoomDocRef(data.roomId).update({ teams: data.teams });
                } else {
                    window.renderClientDashboard();
                }
                var attemptNum = ((data.teams[myTeamId].loanCount || 0) + 1);
                window.showToast("✅ 대출 심사 퀴즈 정답! 선생님에게 " + attemptNum + "회차 대출 신청(" + reqAmount + "pt)이 제출되었습니다.");
            } else {
                playSound('wrong');
                window.showToast("❌ 오답입니다! 지표면 근처에서 빨리 식으면 알갱이가 뭉칠 시간이 부족해 결정이 작아집니다(화산암). 다시 도전하세요.");
            }
        };

        window.clientSelectChoice = function(choice) {
            playSound('click');
            window.clientLocalInput.choice = choice;

            var btnTrue = document.getElementById('btnChoiceTrue');
            var btnFalse = document.getElementById('btnChoiceFalse');
            var btnSubmit = document.getElementById('btnSubmitBid');

            if (btnTrue && btnFalse) {
                if (choice === 'True') {
                    btnTrue.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-amber-600 border-amber-400 text-white shadow-lg';
                    btnFalse.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800';
                } else {
                    btnTrue.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800';
                    btnFalse.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-rose-600 border-rose-400 text-white shadow-lg';
                }
            }

            if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.className = 'w-full py-3.5 rounded-xl font-black transition font-title text-base flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg';
            }
        };

        window.clientUpdateBid = function(val) {
            window.clientLocalInput.bid = parseInt(val);

            var display = document.getElementById('bidValueDisplay');
            if (display) {
                var data = window.gameState.roomData;
                var myTeamId = window.gameState.myTeamId;
                var myTeam = data && data.teams ? data.teams[myTeamId] : null;
                var maxPt = myTeam ? myTeam.points : 100;
                var clampedVal = Math.min(parseInt(val), maxPt);
                display.innerText = clampedVal + ' pt';
            }
        };

        window.clientSubmitBid = function() {
            playSound('click');
            var data = window.gameState.roomData;
            var myTeamId = window.gameState.myTeamId;
            var myTeam = data.teams[myTeamId];
            
            if (!window.clientLocalInput.choice) {
                window.showToast("참(O) 또는 거짓(X) 중 하나를 선택해 주세요!");
                return;
            }

            if (!myTeam) {
                window.showToast("모둠 정보가 올바르지 않습니다. 다시 접속해 주세요.");
                return;
            }

            var rawBid = window.clientLocalInput.bid !== undefined ? window.clientLocalInput.bid : 5;
            var finalBid = Math.min(rawBid, myTeam.points);
            if (myTeam.points < finalBid) {
                finalBid = myTeam.points; 
            }

            myTeam.choice = window.clientLocalInput.choice;
            myTeam.currentBid = finalBid;
            myTeam.submitted = true;

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams }).then(function() {
                    window.showToast("✅ 투자가 성공적으로 제출되었습니다!");
                    window.renderClientDashboard();
                }).catch(function(err) {
                    console.error("투자 제출 에러:", err);
                    window.showToast("❌ 제출 중 오류가 발생했습니다. 다시 시도해 주세요.");
                });
            } else {
                window.renderClientDashboard();
            }
        };

        window.renderDebriefingViewHost = function() {
            playSound('correct');
            var data = window.gameState.roomData;
            data.status = 'debriefing';

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ status: 'debriefing' });
            }

            var teamsList = Object.values(data.teams).sort(function(a, b) {
                var netA = Math.max(0, a.points - (a.debt || 0));
                var netB = Math.max(0, b.points - (b.debt || 0));
                return netB - netA;
            });
            var container = document.getElementById('appContainer');

            container.innerHTML = `
                <div class="max-w-4xl mx-auto w-full space-y-6 my-auto py-4">
                    <div class="glass-panel rounded-3xl p-6 text-center glow-effect border-2 border-amber-500/40 space-y-2">
                        <div class="inline-block bg-amber-500/20 text-amber-400 p-3 rounded-2xl border border-amber-400/30">
                            <i class="fa-solid fa-trophy text-4xl"></i>
                        </div>
                        <h2 class="text-3xl font-black font-title text-amber-300">최종 투자 결과 & 지권 디브리핑</h2>
                        <p class="text-sm text-slate-300">중1 과학 지권 및 화성암 탐구 학습 완수를 축하합니다!</p>
                    </div>

                    <div class="glass-panel rounded-3xl p-6 space-y-4">
                        <h3 class="text-lg font-bold font-title text-amber-300 flex items-center gap-2">
                            <i class="fa-solid fa-ranking-star"></i> 최종 순위표 (1~5모둠전)
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[48vh] overflow-y-auto p-1">
                            ${teamsList.map(function(team, idx) {
                                var debt = team.debt || 0;
                                var netScore = Math.max(0, team.points - debt);
                                var loanCount = team.loanCount || 0;
                                var rescueBadge = loanCount > 0 
                                    ? (debt > 0 
                                        ? `<span class="text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-1.5 py-0.5 rounded font-bold ml-2">대출 ${loanCount}회 (미상환 ${debt}p 차감)</span>` 
                                        : `<span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded font-bold ml-2">대출 ${loanCount}회 (전액 상환 완료! ✨)</span>`)
                                    : `<span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-bold ml-2">대출 미이용 ✨</span>`;

                                return `
                                    <div class="bg-slate-900/80 p-3.5 rounded-2xl border ${idx === 0 ? 'border-amber-400/60 bg-amber-950/20' : 'border-slate-700/60'} flex justify-between items-center">
                                        <div class="flex items-center gap-2.5 truncate">
                                            <span class="w-7 h-7 rounded-xl font-black text-xs flex items-center justify-center shrink-0 ${idx === 0 ? 'bg-amber-400 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}">
                                                ${idx + 1}
                                            </span>
                                            <div class="truncate">
                                                <div class="font-bold text-sm text-slate-100 font-title truncate">${team.name}</div>
                                                ${rescueBadge}
                                            </div>
                                        </div>
                                        <div class="text-right shrink-0">
                                            <div class="text-emerald-400 font-black text-base">
                                                ${netScore} pt
                                            </div>
                                            ${debt > 0 ? `<div class="text-[10px] text-slate-400">보유: ${team.points}p</div>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <button onclick="finishClassAndClear()" class="w-full py-4 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black rounded-2xl shadow-xl transition text-base font-title">
                        수업 완수 및 메인으로 돌아가기
                    </button>
                </div>
            `;
        };

        window.finishClassAndClear = function() {
            localStorage.removeItem('earth_strata_team_host_pin');
            if (window.hostPingInterval) clearInterval(window.hostPingInterval);
            if (window.roomUnsubscribe) {
                window.roomUnsubscribe();
                window.roomUnsubscribe = null;
            }
            window.gameState.role = null;
            window.gameState.roomId = null;
            document.getElementById('roomPinBadge').classList.add('hidden');
            window.renderRoleSelection();
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window.initApp);
        } else {
            window.initApp();
        }
    </script>
</body>
</html>
